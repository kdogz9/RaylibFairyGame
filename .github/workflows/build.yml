name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.50

      - name: Build Raylib for Web
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib.git
          cd raylib/src
          emmake make PLATFORM=PLATFORM_WEB -B
          cd ../..

      - name: Locate Source Files and Compile
        run: |
          # Find main.cpp wherever it is in the repository
          MAIN_PATH=$(find . -maxdepth 3 -name "main.cpp" | head -n 1)
          SOURCE_DIR=$(dirname "$MAIN_PATH")
          echo "Found source in: $SOURCE_DIR"

          # Prepare output folder
          mkdir -p dist

          # Copy fairy.png into source folder if not already alongside main.cpp
          find . -name "fairy.png" -exec cp {} "$SOURCE_DIR/" \; || true

          cd "$SOURCE_DIR"

          emcc -o ../dist/index.html main.cpp \
            -Os -Wall \
            -I../../raylib/src -L../../raylib/src -lraylib \
            -s USE_GLFW=3 \
            -s ASYNCIFY \
            -s FETCH=1 \
            --preload-file fairy.png

      - name: Upload Build Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your main branch is called master

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.50

      - name: Download & Build Raylib for Web
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib.git
          cd raylib/src
          emmake make PLATFORM=PLATFORM_WEB -B
          cd ../..

      - name: Compile Game to WebAssembly
        run: |
          emcc -o index.html main.cpp \
            -Os -Wall \
            -I./raylib/src -L./raylib/src -lraylib \
            -s USE_GLFW=3 \
            -s ASYNCIFY \
            -s FETCH=1 \
            --preload-file fairy.png

      - name: Upload Build Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4